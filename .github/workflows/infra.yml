name: infra

# Pipeline de infraestructura. Es dueño de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:

jobs:

  # B1. Verificar sintaxis, formato, backend e integridad
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Comprobar formato (terraform fmt)
        run: terraform fmt -check
        working-directory: infra

      - name: Inicializar Terraform (terraform init)
        run: terraform init -backend-config=backend.hcl
        working-directory: infra

      - name: Validar código (terraform validate)
        run: terraform validate
        working-directory: infra

  # B2. Analizar políticas IaC (Detiene ante hallazgos HIGH/CRITICAL)
  politicas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Escaneo de políticas IaC con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # B3. Generar plan, publicar en PR y verificar destrucciones no autorizadas
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Inicializar Terraform
        run: terraform init -backend-config=backend.hcl
        working-directory: infra

      - name: Generar Plan
        id: plan
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json
        working-directory: infra

      - name: Publicar Plan en Pull Request (Regla 2)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const execSync = require('child_process').execSync;
            const planText = execSync('cd infra && terraform show tfplan -no-color').toString();
            const body = `#### 📋 Plan de Infraestructura (Terraform)
            \`\`\`hcl
            ${planText.substring(0, 60000)}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Validar Destrucciones No Autorizadas (Regla 1)
        run: |
          cd infra
          # Extraer las acciones del plan JSON y verificar si hay eliminaciones/reemplazos
          DELETES=$(jq '[.resource_changes[]?.change.actions[] | select(. == "delete")] | length' tfplan.json)
          if [ "$DELETES" -gt "0" ]; then
            echo "::error::El plan contiene $DELETES acciones de destruccion/reemplazo no autorizadas."
            exit 1
          fi

      - name: Subir artefacto del plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan

  # B4. Aplicar el plan en AWS (Solo en main)
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Descargar artefacto del plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/

      - name: Inicializar Terraform
        run: terraform init -backend-config=backend.hcl
        working-directory: infra

      - name: Aplicar Plan (terraform apply)
        run: terraform apply -auto-approve tfplan
        working-directory: infra
